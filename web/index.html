<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정비산업기사 주관식</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="theme-color" content="#f2f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정비 주관식">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans", "Pretendard", "system-ui", "sans-serif"] } } } };
</script>
<style>
  /* ---- 디자인 토큰: Atmospheric Serenity (color/DESIGN.md) ---- */
  :root{
    --ground:#dce5ee; --surface:rgba(255,255,255,.78); --raised:#e7eeff;
    --border:rgba(255,255,255,.65); --rule:rgba(16,64,232,.07); --control:rgba(142,167,194,.55);
    --text:#1e293b; --muted:#64748b; --faint:#64748b;
    --primary:#1040e8; --accent:#1040e8; --accent-tint:#e7eeff;
    --positive:#247b50; --negative:#c4242a;
    --warning-bg:#fffbeb; --warning-border:#fde68a; --warning-ink:#92400e;
    --radius-card:0; --radius-control:0;
    --shadow-card:0 8px 32px -4px rgba(16,64,232,.08),0 2px 8px -2px rgba(30,41,59,.05);
    --font:"Plus Jakarta Sans","Pretendard",system-ui,sans-serif;
    --display:"Space Grotesk","Pretendard",system-ui,sans-serif;
    --mono:"Space Grotesk",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:linear-gradient(180deg,#dce5ee 0%,#c8d6e5 100%);background-attachment:fixed;/* taste-skill-ignore: color/DESIGN.md의 Atmospheric Canvas 그라데이션은 지정된 디자인이다 */color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  h1,.product{font-family:var(--display)}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .1s ease}
  button:active:not(:disabled){transform:scale(.99)}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}

  /* 공통 컨트롤: 평평한 면, 1px 테두리, 6px 모서리, 높이 36px */
  .btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-control);font-size:14px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:#9aa3ae}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:#002cb5;border-color:#002cb5}
  .btn-wide{flex:1;height:44px;font-weight:600}
  .select{height:36px;padding:0 10px;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-control);font-size:14px;max-width:62%}

  /* 상단: 제품 이름이 셸, 기능은 오른쪽 */
  main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  main.wide{max-width:1200px!important}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px}
  .product{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #pos{font-size:14px;color:var(--muted)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
  .toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #clock{display:flex;align-items:center;gap:8px}
  #clockDots{display:flex;gap:4px}
  #clockDots span{border-radius:0!important}
  #clockDate{font-size:12px;color:var(--muted)}

  /* 진행: 주요 데이터 한 곳(차트색) */
  /* app.js가 이 패널을 떠다니게 옮기는 값(translate3d)을 막는다. 제자리 줄 안에 둔다. */
  #progress{transform:none!important;margin-top:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
  .prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
  #progNum{font-size:16px;font-weight:500;color:var(--text)}
  .bar{height:6px;background:var(--rule);border-radius:0;overflow:hidden}
  #progFill{height:100%;width:0;background:var(--accent);border-radius:0;transition:width .5s ease-out}

  /* 본문 */
  .split{display:block}
  main.wide .split{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
  .study{display:flex;flex-direction:column;align-items:stretch;padding:20px 0 0}
  .stage{position:relative;width:100%}
  @media (min-width:900px){
    main.wide .split{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
    .page-view{position:sticky;top:16px}
  }
  .page-tools{display:flex;justify-content:flex-end;margin-bottom:8px}
  .page-frame{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;margin-bottom:12px}
  .page-frame img{width:100%;height:auto;display:block}
  .ans-blur{position:absolute;background:rgba(255,255,255,.55);border-radius:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)} /* taste-skill-ignore: 정답 가림용 블러는 기능이다 */
  .unblur .ans-blur{display:none}

  /* 문제 카드: 흰 면, 1px 테두리, 그림자 없음 */
  #card{position:relative;z-index:1;background:var(--surface);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius-card);padding:28px;box-shadow:var(--shadow-card)}
  #set{font-size:13px;color:var(--muted)}
  #question{margin-top:12px;font-size:19px;font-weight:600;line-height:1.6;letter-spacing:-.01em;word-break:keep-all}
  #card-next-wrap{position:relative}
  #card-next-wrap>#card{position:relative;z-index:1}
  .card-next{position:absolute;inset:0;z-index:0;pointer-events:none;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);transform:translate3d(0,10px,0) scale(.97);opacity:.6}
  #nextSet{font-size:13px;color:var(--muted)}
  #nextQ{margin-top:12px;font-size:17px;font-weight:600;word-break:keep-all}

  #answerOpen{margin-top:24px;width:100%;padding:14px;background:transparent;border:1px dashed #b8c0ca;border-radius:var(--radius-control);font-size:14px;color:var(--muted)}
  #choices{margin-top:24px;display:grid;gap:8px}
  #answerBox{margin-top:24px}
  #answerIn{width:100%;resize:none;padding:14px 16px;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-control);font-size:16px;line-height:1.6}
  #answerIn:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(16,64,232,.15)}
  #submit{margin-top:12px;width:100%;height:44px;background:var(--primary);color:#fff;border:0;border-radius:var(--radius-control);font-weight:600}
  #submit:hover{background:#002cb5}
  #revealBox{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
  #revealBox > p:first-child{font-size:13px;color:var(--muted)}
  #reveal{margin-top:4px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}
  #revealNote{margin-top:8px;font-size:13px;color:var(--warning-ink)}
  #fix{margin-top:16px;padding:12px 14px;background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:var(--radius-control)}
  #fix p:first-child{font-size:13px;font-weight:600;color:var(--warning-ink)}
  #fixText{margin-top:4px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}

  /* 선택지: 맞은 답만 차트색, 틀린 답은 가로줄 */
  .choice{display:block;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-control);font-size:15px;color:var(--text)}
  .choice:hover:not(:disabled){border-color:#9aa3ae}
  .choice:disabled{cursor:default}
  .choice.pick{border-color:var(--primary)}
  .choice.right{background:var(--accent-tint);border-color:var(--accent);font-weight:600;color:var(--accent)}
  .choice.wrong{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

  /* 이전/다음: 다음이 주 동작 */
  .pager{display:flex;gap:10px;margin-top:16px}

  /* 쌓인 카드 더미 (맞힌·틀린 문항) */
  #pile{position:relative;align-self:stretch;height:96px;margin:8px 4px 0;z-index:0}
  .pile-side{position:absolute;top:0;height:70px;width:46%}
  .pile-right{left:50%;--tone:var(--accent)}
  .pile-left{right:50%;--tone:#8a929c}
  .pile-side>div{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;padding:0 14px;cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--tone);transform:translate3d(calc(var(--d)*3px),calc(var(--d)*3px),0) rotate(var(--r,0deg));transition:transform var(--pile-ms,500ms) cubic-bezier(.2,.8,.2,1),background .2s;transition-delay:calc(var(--d)*28ms)}
  .pile-side>div:hover{background:var(--raised)}
  .pile-side .pm{color:var(--tone);font-weight:700;margin-right:8px;font-family:var(--mono)}
  .pile-tag{position:absolute;top:74px;font-size:12px;color:var(--muted);font-family:var(--mono);font-weight:500;white-space:nowrap;pointer-events:none}
  .pile-right .pile-tag{left:0}
  .pile-left .pile-tag{right:0}
  .pile-review{pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

  /* 번호 점 */
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:300px;margin:20px auto 0}
  .dot{width:9px;height:9px;border-radius:0!important;border:1.5px solid #aab3be;background:transparent;padding:0}
  .dot:hover{transform:scale(1.3)}
  .dot.ok{background:var(--accent);border-color:var(--accent)}
  .dot.ng{background:#8a929c;border-color:#8a929c}
  .dot.cur{outline:2px solid rgba(17,20,24,.18);outline-offset:2px;transform:scale(1.2)}

  #hint{margin-top:20px;font-size:13px;color:var(--muted);text-align:center}
  #voice{margin:16px auto 0}
  #status{margin-top:12px;min-height:20px;text-align:center;font-size:14px;color:var(--muted)}

  /* 해설 시트: 카드 안 답 아래에 펼쳐진다 */
  .sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:72dvh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--border);border-radius:0;padding:12px 24px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .sheet.open{transform:none}
  #sheet.inline{position:relative;inset:auto;transform:none;max-height:none;overflow:visible;max-width:none;z-index:auto;background:transparent;border:0;border-top:1px solid var(--rule);border-radius:0;padding:20px 0 0;margin:24px 0 0}
  #sheet.inline>div:first-child{display:none}
  .sheet-grip{width:40px;height:4px;background:var(--control);border-radius:0;margin:0 auto 14px}
  .scrim{position:fixed;inset:0;z-index:29;background:rgba(17,20,24,.25);opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  #chip{font-size:20px;font-weight:700}
  #close{height:32px;padding:0 10px;font-size:14px;color:var(--muted);background:transparent;border:0}
  #sections{margin-top:16px;display:grid;gap:18px}
  #next{margin-top:22px;width:100%;height:44px;background:var(--primary);color:#fff;border:0;border-radius:var(--radius-control);font-weight:600}

  /* 목차 */
  #listPanel{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--ground)}
  .list-wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  #listSearch{margin-top:12px;width:100%;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--control);border-radius:var(--radius-control);font-size:14px}

  /* 화면 가장자리 장식과 떠 있는 키는 쓰지 않는다 (JS는 그대로 동작) */
  .gauge,.edge-no,.edge-nav,.today{display:none!important}
  #loaderPause{position:fixed;left:12px;bottom:14px;z-index:5;width:40px;height:40px;padding:0;font-size:14px;line-height:1;border-radius:0;background:var(--surface);border:1px solid var(--control);color:var(--text)}

  @media (max-width:640px){
    main{padding:16px 16px 104px}
    .pager{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
    .pager .btn-wide{height:44px}
    header.topbar{flex-direction:column;align-items:flex-start}
    .actions{width:100%}
    .select{max-width:100%;flex:1 1 100%}
    #card{padding:20px}
    #loaderPause{left:12px;bottom:calc(84px + env(safe-area-inset-bottom))}
    .sheet{max-height:80dvh}
  }
  @media (hover:none){
    button:hover:not(:disabled),.choice:hover:not(:disabled),.dot:hover{transform:none}
  }
</style>
</head>
<body class="min-h-dvh antialiased atmos">

<main id="main">
  <header class="topbar">
    <div class="brand">
      <h1 class="product">정비산업기사 기출 풀이</h1>
      <span id="pos" class="mono"></span>
    </div>
    <div class="actions">
      <a id="diagLink" class="btn" href="diagrams/diagrams_3d.html">3D 해설</a>
      <button id="modeBtn" type="button" class="btn">모드</button>
      <button id="listBtn" type="button" class="btn">목차</button>
    </div>
  </header>

  <div class="toolbar">
    <select id="subject" aria-label="과목" class="select"></select>
    <div class="toolbar-right">
      <div id="clock" aria-label="현재 시간">
        <div id="clockDots"></div>
        <div id="clockDate" class="mono"></div>
      </div>
    </div>
  </div>

  <div id="progress">
    <div class="prog-row">
      <span id="progNum" class="mono">0 / 0</span>
      <span id="progSub">남은 0</span>
    </div>
    <div class="bar"><div id="progFill" style="width:0%"></div></div>
  </div>

  <div id="split" class="split">
    <aside id="pageView" class="page-view" hidden>
      <div class="page-tools"><button id="blurToggle" type="button" class="btn">블러 끄기</button></div>
      <div id="figures"></div>
    </aside>

    <div class="study">
      <div id="stage" class="stage">
        <div id="card-next-wrap">
        <div id="cardNext" class="card-next" aria-hidden="true">
          <p id="nextSet"></p>
          <p id="nextQ"></p>
        </div>
        <article id="card" class="card">
          <p id="set"></p>
          <p id="question"></p>

          <button id="answerOpen" type="button">정답 쓰기 (눌러서 열기)</button>

          <div id="choices" hidden></div>

          <div id="answerBox" hidden>
            <textarea id="answerIn" rows="4" placeholder="답을 적고 제출하세요"></textarea>
            <button id="submit" type="button">제출</button>
          </div>

          <div id="revealBox" hidden>
            <p>정답</p>
            <p id="reveal"></p>
            <p id="revealNote" hidden></p>
            <div id="fix" hidden>
              <p>교차검증 교정답 · 원본 없음, 검수 필요</p>
              <p id="fixText"></p>
            </div>
          </div>
        </article>
        </div>

        <div class="pager">
          <button id="prevInline" type="button" class="btn btn-wide">&lsaquo; 이전</button>
          <button id="nextInline" type="button" class="btn btn-primary btn-wide">다음 &rsaquo;</button>
        </div>

        <div id="pile" hidden>
          <div id="pileWrong" class="pile-side pile-left"><button id="pileWrongTag" class="pile-tag pile-review" type="button"></button></div>
          <div id="pileRight" class="pile-side pile-right"><span id="pileRightTag" class="pile-tag"></span></div>
        </div>
      </div>

      <div id="dots" class="dots" hidden></div>
      <p id="hint">왼쪽으로 밀면 이전, 오른쪽으로 밀면 다음</p>
      <button id="voice" type="button" class="btn">정비소 모드 켜 줘</button>
      <p id="status" role="status"></p>
    </div>
  </div>
</main>

<button id="loaderPause" type="button" aria-pressed="false" aria-label="캐릭터 일시정지">⏸</button>

<div id="scrim" class="scrim"></div>
<section id="sheet" class="sheet" aria-label="채점 결과">
  <div class="sheet-grip"></div>
  <div class="flex items-center justify-between">
    <span id="chip"></span>
    <button id="close" type="button">닫기</button>
  </div>
  <div id="sections"></div>
  <button id="next" type="button">다음 문제</button>
</section>

<div id="bigNo" class="edge-no" aria-hidden="true"><span id="bigNoV"></span><small id="bigNoT"></small></div>
<button id="navPrev" class="edge-nav" type="button" aria-label="이전 문제">&lsaquo;</button>
<button id="navNext" class="edge-nav" type="button" aria-label="다음 문제">&rsaquo;</button>
<div id="today" class="today" aria-hidden="true"></div>
<div id="gaugeL" class="gauge" aria-hidden="true"><div class="gauge-track"><div id="gaugeLFill" class="gauge-fill"></div></div><span id="gaugeLTxt" class="gauge-txt"></span></div>
<div id="gaugeR" class="gauge" aria-hidden="true"><div class="gauge-track"><div id="gaugeRFill" class="gauge-fill"></div></div><span id="gaugeRTxt" class="gauge-txt"></span></div>

<section id="listPanel" hidden>
  <div class="list-wrap">
    <div class="flex items-center justify-between gap-3">
      <p class="text-lg font-bold">문제 목차 <span class="text-xs font-normal muted">○ = 객관식 가능</span></p>
      <button id="listClose" type="button" class="btn">닫기</button>
    </div>
    <div class="mt-4 flex items-center justify-between gap-3">
      <p id="listScope" class="text-sm muted"></p>
      <button id="listScopeBtn" type="button" class="btn">전체 보기</button>
    </div>
    <input id="listSearch" type="search" placeholder="문제 내용으로 찾기" aria-label="문제 찾기">
    <div id="listBody" class="mt-2"></div>
  </div>
</section>

<script src="data/study-data.js"></script>
<script src="study-static.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
