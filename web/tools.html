<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정비 학습 도구</title>
<style>
  :root{--ground:#dce5ee;--surface:#fff;--text:#1e293b;--muted:#64748b;--primary:#1040e8;--ok:#247b50;--bad:#c4242a;--line:rgba(16,64,232,.16)}
  *{box-sizing:border-box;border-radius:0}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#dce5ee 0%,#c8d6e5 100%);background-attachment:fixed;color:var(--text);font-family:"Plus Jakarta Sans",Pretendard,system-ui,sans-serif;line-height:1.6}
  header{padding:16px 16px 0;max-width:820px;margin:0 auto}
  h1{font-family:"Space Grotesk",Pretendard,system-ui,sans-serif;font-size:20px;margin:0 0 10px}
  nav{display:flex;flex-wrap:wrap;gap:6px}
  nav button,button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--primary);cursor:pointer}
  nav button[aria-pressed="true"]{background:var(--primary);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  main{max-width:820px;margin:0 auto;padding:16px}
  section{background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 32px -4px rgba(16,64,232,.08);padding:16px}
  section[hidden]{display:none}
  h2{font-size:17px;margin:0 0 10px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  select,input[type=search]{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);background:#fff;max-width:100%}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  fieldset.qbox{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0}
  legend{font-size:12px;color:var(--muted);padding:0}
  .qtext{white-space:pre-wrap;break-keep:keep-all;margin:6px 0;font-size:15px}
  .fig{max-width:100%;border:1px solid var(--line);margin:6px 0}
  label.choice{display:block;padding:6px 8px;margin:3px 0;border:1px solid transparent;cursor:pointer;font-size:15px}
  label.choice:hover{border-color:var(--line);background:#f5f8ff}
  .timer{font-family:"Space Grotesk",monospace;font-size:18px;font-weight:700;color:var(--primary)}
  .tag{font-size:12px;padding:2px 6px;border:1px solid currentColor}
  .tag.correct{color:var(--ok)} .tag.wrong{color:var(--bad)} .tag.unknown{color:var(--muted)}
  details{border-bottom:1px solid var(--line);padding:8px 0}
  summary{cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .star{border:0;background:transparent;font-size:18px;padding:0 4px;color:#b7791f}
  .body p{margin:4px 0;font-size:14px;white-space:pre-wrap}
  .card{min-height:200px;padding:18px;border:1px solid var(--line);background:#fbfdff;cursor:pointer;white-space:pre-wrap;font-size:16px;line-height:1.7}
  .card .face{font-size:12px;color:var(--muted);margin-bottom:8px}
  #status{font-size:13px;color:var(--bad);min-height:1em}
  @media print{
    header,nav,.noprint{display:none!important}
    body{background:#fff}
    main{padding:0}
    section{border:0;box-shadow:none}
    section[hidden]{display:none}
  }
  @media (max-width:520px){ main{padding:10px} section{padding:12px} }
</style>
</head>
<body>
<nav class="sitebar" aria-label="사이트 이동"><a href="hub.html">허브</a><a href="index.html">문제풀이</a><a href="tools.html" aria-current="page">학습 도구</a></nav>
<style>.sitebar{position:sticky;top:0;z-index:45;display:flex;gap:4px;padding:8px 12px;background:rgba(251,251,250,.94);border-bottom:1px solid rgba(16,64,232,.16)}.sitebar a{padding:6px 12px;color:#1040e8;text-decoration:none;font-size:14px;border:1px solid transparent}.sitebar a:hover{border-color:rgba(16,64,232,.3)}.sitebar a[aria-current="page"]{background:#1040e8;color:#fff}</style>
<header>
  <h1>정비 학습 도구</h1>
  <nav class="noprint">
    <button type="button" data-tab="mock" aria-pressed="true">모의고사</button>
    <button type="button" data-tab="dash" aria-pressed="false">과목 대시보드</button>
    <button type="button" data-tab="notes" aria-pressed="false">책갈피·오답</button>
    <button type="button" data-tab="cards" aria-pressed="false">암기 카드</button>
  </nav>
  <p id="status" class="noprint"></p>
</header>

<main>
  <!-- 모의고사 -->
  <section id="tab-mock">
    <div id="mockIntro">
      <h2>실전 모의고사</h2>
      <p class="muted">객관식 문항 중 40개를 무작위로 뽑습니다. 제한 시간은 60분이고, 끝나면 자동으로 채점됩니다. 결과는 과목 대시보드에서 다시 볼 수 있습니다. 풀이 기록(진도)에는 섞이지 않습니다.</p>
      <button type="button" id="mockStart">모의고사 시작</button>
    </div>
    <div id="mockRun" hidden>
      <div class="row">
        <span class="timer" id="mockTimer"></span>
        <button type="button" id="mockSubmit">제출하고 채점</button>
      </div>
      <form id="mockForm"></form>
    </div>
    <div id="mockResult" hidden></div>
  </section>

  <!-- 과목 대시보드 -->
  <section id="tab-dash" hidden>
    <h2>과목별 현황</h2>
    <p class="muted">문제풀이 화면에서 푼 기록을 기준으로 합니다. 정답률은 정답·오답·부분 정답 중 정답의 비율입니다.</p>
    <div id="dashTable"></div>
    <h2 style="margin-top:18px">모의고사 기록</h2>
    <div id="dashMock"></div>
  </section>

  <!-- 책갈피·오답 -->
  <section id="tab-notes" hidden>
    <h2>책갈피·오답 노트</h2>
    <div class="row noprint">
      <select id="nMode">
        <option value="either">책갈피 또는 오답</option>
        <option value="mark">책갈피만</option>
        <option value="wrong">오답만</option>
        <option value="all">전체</option>
      </select>
      <select id="nSubj"></select>
      <input type="search" id="nQ" placeholder="문제 검색">
    </div>
    <div class="row noprint">
      <button type="button" id="nMd">Markdown 내려받기</button>
      <button type="button" id="nPrint">인쇄</button>
      <span class="muted" id="nCount"></span>
    </div>
    <div id="nList"></div>
  </section>

  <!-- 암기 카드 -->
  <section id="tab-cards" hidden>
    <h2>암기 카드</h2>
    <div class="row noprint">
      <select id="cMode">
        <option value="all">전체</option>
        <option value="either">책갈피 또는 오답</option>
        <option value="mark">책갈피만</option>
        <option value="wrong">오답만</option>
      </select>
      <select id="cSubj"></select>
      <label class="muted"><input type="checkbox" id="cHide"> 외운 카드 빼기</label>
      <button type="button" id="cShuffle">섞기</button>
    </div>
    <div class="card" id="cCard" role="button" tabindex="0" aria-label="카드 뒤집기"></div>
    <div class="row">
      <button type="button" id="cPrev">이전</button>
      <button type="button" id="cNext">다음</button>
      <button type="button" id="cKnown">외웠어요</button>
      <span class="muted" id="cPos"></span>
    </div>
  </section>
</main>

<script src="data/study-data.js"></script>
<script>
(() => {
  const D = window.STUDY_DATA || { items: [], secret: {} };
  const items = D.items;
  const secret = D.secret;
  const byN = new Map(items.map((x) => [x.n, x]));
  const $ = (id) => document.getElementById(id);
  const err = (msg) => { $("status").textContent = msg || ""; };

  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { err(`저장하지 못했습니다: ${e.message}`); } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const today = () => new Date().toISOString().slice(0, 10);
  const mcOk = (x) => secret[x.n] && secret[x.n].ci !== null;
  const hasKey = (x) => secret[x.n] && secret[x.n].answer && !secret[x.n].answer.startsWith("원본 자료에");
  const verdictOf = (x) => load("solvedUV", {})[x.uid];
  const bookmarks = () => new Set(load("bookmarkU", []));
  const subjects = [...new Set(items.map((x) => x.subject))];
  const LABEL = { correct: "정답", wrong: "오답", partial: "부분 정답", unknown: "판정 불명" };

  function fillSubjects(sel) {
    sel.textContent = "";
    sel.append(el("option", "", "전체 과목"));
    sel.lastChild.value = "";
    subjects.forEach((s) => { const o = el("option", "", s); o.value = s; sel.append(o); });
  }

  function answerText(x) {
    const s = secret[x.n];
    if (mcOk(x) && x.choices && x.choices[s.ci] != null) return `${s.ci + 1}) ${x.choices[s.ci]}`;
    return s.answer || "";
  }

  // ---- 탭 ----
  function show(t) {
    ["mock", "dash", "notes", "cards"].forEach((k) => { $("tab-" + k).hidden = k !== t; });
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === t)));
    if (t === "dash") renderDash();
    if (t === "notes") renderNotes();
    if (t === "cards") renderCard();
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));

  // ---- 1. 모의고사 ----
  let mockIds = [];
  let mockTimerId = null;
  let mockEnd = 0;
  const COUNT = 40;
  const LIMIT_MIN = 60;

  function startMock() {
    const pool = items.filter(mcOk);
    if (!pool.length) { err("객관식 문항이 없습니다."); return; }
    mockIds = shuffle(pool).slice(0, COUNT).map((x) => x.n);
    const form = $("mockForm");
    form.textContent = "";
    mockIds.forEach((n, k) => {
      const x = byN.get(n);
      const box = el("fieldset", "qbox");
      box.append(el("legend", "", `${k + 1}. ${x.subject} · ${x.set} · ${n}번`));
      box.append(el("p", "qtext", x.question));
      (x.figures || []).forEach((src) => { const img = el("img", "fig"); img.src = src; img.loading = "lazy"; img.alt = ""; box.append(img); });
      (x.choices || []).forEach((c, i) => {
        const lab = el("label", "choice");
        const r = el("input");
        r.type = "radio"; r.name = "q" + n; r.value = String(i);
        lab.append(r, document.createTextNode(` ${"①②③④⑤"[i] || i + 1} ${c}`));
        box.append(lab);
      });
      form.append(box);
    });
    $("mockIntro").hidden = true;
    $("mockResult").hidden = true;
    $("mockRun").hidden = false;
    mockEnd = Date.now() + LIMIT_MIN * 60 * 1000;
    tick();
    clearInterval(mockTimerId);
    mockTimerId = setInterval(tick, 1000);
    window.scrollTo(0, 0);
  }

  function tick() {
    const left = Math.max(0, mockEnd - Date.now());
    const m = Math.floor(left / 60000);
    const s = Math.floor(left / 1000) % 60;
    $("mockTimer").textContent = `남은 시간 ${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    if (left === 0) submitMock();
  }

  function submitMock() {
    if ($("mockRun").hidden) return;
    clearInterval(mockTimerId);
    mockTimerId = null;
    const fd = new FormData($("mockForm"));
    let score = 0;
    const per = {};
    const wrongs = [];
    mockIds.forEach((n) => {
      const x = byN.get(n);
      const pick = fd.get("q" + n);
      const ok = pick !== null && Number(pick) === secret[n].ci;
      const p = per[x.subject] || (per[x.subject] = { t: 0, c: 0 });
      p.t += 1;
      if (ok) { score += 1; p.c += 1; } else { wrongs.push({ x, pick: pick === null ? null : Number(pick) }); }
    });
    const hist = load("mockHist", []);
    hist.push({ at: today(), score, total: mockIds.length, per });
    save("mockHist", hist);
    $("mockRun").hidden = true;
    renderMockResult(score, per, wrongs);
  }

  function renderMockResult(score, per, wrongs) {
    const box = $("mockResult");
    box.textContent = "";
    const total = mockIds.length;
    box.append(el("h2", "", `결과: ${score} / ${total} (${Math.round((score / total) * 100)}%)`));
    const t = el("table");
    const head = el("tr");
    ["과목", "정답", "문항", "정답률"].forEach((h, i) => head.append(el("th", i ? "num" : "", h)));
    t.append(head);
    Object.entries(per).forEach(([s, v]) => {
      const tr = el("tr");
      tr.append(el("td", "", s), el("td", "num", String(v.c)), el("td", "num", String(v.t)), el("td", "num", `${Math.round((v.c / v.t) * 100)}%`));
      t.append(tr);
    });
    box.append(t);
    box.append(el("h2", "", `틀린 문항 ${wrongs.length}개`));
    wrongs.forEach(({ x, pick }) => {
      const d = el("details");
      const sum = el("summary");
      sum.append(el("span", "tag wrong", "오답"), el("span", "", `${x.n}번 · ${x.subject}`));
      d.append(sum);
      const body = el("div", "body");
      body.append(el("p", "", x.question));
      body.append(el("p", "", `내 답: ${pick === null ? "미응답" : `${pick + 1}) ${x.choices[pick]}`}`));
      body.append(el("p", "", `정답: ${answerText(x)}`));
      if (secret[x.n].solution) body.append(el("p", "", `풀이: ${secret[x.n].solution}`));
      d.append(body);
      box.append(d);
    });
    const again = el("button", "", "새 모의고사");
    again.type = "button";
    again.addEventListener("click", startMock);
    box.append(el("div", "row"));
    box.lastChild.append(again);
    box.hidden = false;
    window.scrollTo(0, 0);
  }

  $("mockStart").addEventListener("click", startMock);
  $("mockSubmit").addEventListener("click", () => {
    if (confirm("제출하면 바로 채점합니다. 제출할까요?")) submitMock();
  });

  // ---- 2. 과목 대시보드 ----
  function renderDash() {
    const uv = load("solvedUV", {});
    const rows = new Map(subjects.map((s) => [s, { total: 0, solved: 0, correct: 0, attempted: 0 }]));
    items.forEach((x) => {
      const r = rows.get(x.subject);
      r.total += 1;
      const v = uv[x.uid];
      if (!v) return;
      r.solved += 1;
      if (v === "correct" || v === "wrong" || v === "partial") r.attempted += 1;
      if (v === "correct") r.correct += 1;
    });
    const box = $("dashTable");
    box.textContent = "";
    const t = el("table");
    const head = el("tr");
    ["과목", "푼 문항", "남은 비율", "정답률", "정답/시도"].forEach((h, i) => head.append(el("th", i ? "num" : "", h)));
    t.append(head);
    let weakest = null;
    rows.forEach((r, s) => {
      const acc = r.attempted ? Math.round((r.correct / r.attempted) * 100) : null;
      if (r.attempted >= 3 && (weakest === null || acc < weakest.acc)) weakest = { s, acc };
      const tr = el("tr");
      tr.append(
        el("td", "", s),
        el("td", "num", `${r.solved} / ${r.total}`),
        el("td", "num", r.total ? `${Math.round(((r.total - r.solved) / r.total) * 100)}%` : "-"),
        el("td", "num", acc === null ? "-" : `${acc}%`),
        el("td", "num", `${r.correct} / ${r.attempted}`),
      );
      t.append(tr);
    });
    const tot = [...rows.values()].reduce((a, r) => ({ total: a.total + r.total, solved: a.solved + r.solved }), { total: 0, solved: 0 });
    const pct = tot.total ? Math.round((tot.solved / tot.total) * 100) : 0;
    const bar = `<div role="img" aria-label="완주율 ${pct}%" style="height:14px;margin:6px 0;background:#e2e8f0"><div style="height:100%;width:${pct}%;background:url(img/loadbar.svg) repeat-x left center / auto 100%"></div></div>`;
    const sum = el("div", "");
    sum.innerHTML = `<p>전체 ${tot.total}문항 중 ${tot.solved}문항 풀이 · 완주율 ${pct}% · 남은 ${100 - pct}%(${tot.total - tot.solved}문항)</p>${bar}`;
    box.append(sum);
    box.append(t);
    box.append(el("p", "muted", weakest ? `가장 약한 과목(시도 3회 이상): ${weakest.s} (${weakest.acc}%)` : "시도 3회 이상인 과목이 생기면 가장 약한 과목을 알려 드립니다."));

    const mb = $("dashMock");
    mb.textContent = "";
    const hist = load("mockHist", []);
    if (!hist.length) { mb.append(el("p", "muted", "아직 모의고사 기록이 없습니다.")); return; }
    const avg = Math.round((hist.reduce((a, h) => a + h.score / h.total, 0) / hist.length) * 100);
    mb.append(el("p", "muted", `${hist.length}회 응시, 평균 ${avg}%`));
    hist.slice(-10).reverse().forEach((h) => {
      mb.append(el("p", "", `${h.at} · ${h.score} / ${h.total} (${Math.round((h.score / h.total) * 100)}%)`));
    });
  }

  // ---- 3. 책갈피·오답 노트 ----
  function noteList() {
    const mode = $("nMode").value;
    const subj = $("nSubj").value;
    const q = $("nQ").value.trim();
    const marks = bookmarks();
    return items.filter((x) => {
      if (subj && x.subject !== subj) return false;
      if (q && !(x.question || "").includes(q)) return false;
      const wrong = verdictOf(x) === "wrong";
      const mark = marks.has(x.uid);
      if (mode === "mark") return mark;
      if (mode === "wrong") return wrong;
      if (mode === "either") return mark || wrong;
      return true;
    });
  }

  function renderNotes() {
    const list = noteList();
    const marks = bookmarks();
    const box = $("nList");
    box.textContent = "";
    $("nCount").textContent = `${list.length}문항`;
    list.slice(0, 400).forEach((x) => {
      const d = el("details");
      const sum = el("summary");
      const star = el("button", "star", marks.has(x.uid) ? "★" : "☆");
      star.type = "button";
      star.setAttribute("aria-label", "책갈피");
      star.addEventListener("click", (e) => { e.preventDefault(); toggleMark(x.uid); });
      sum.append(star, el("span", "", `${x.n}번 · ${x.subject}`));
      const v = verdictOf(x);
      if (v) sum.append(el("span", `tag ${v}`, LABEL[v] || v));
      d.append(sum);
      const body = el("div", "body");
      body.append(el("p", "", x.question));
      (x.choices || []).forEach((c, i) => body.append(el("p", "", `${"①②③④⑤"[i] || i + 1} ${c}`)));
      body.append(el("p", "", `정답: ${answerText(x)}`));
      if (secret[x.n] && secret[x.n].solution) body.append(el("p", "", `풀이: ${secret[x.n].solution}`));
      d.append(body);
      box.append(d);
    });
    if (list.length > 400) box.append(el("p", "muted", "상위 400개만 보여 줍니다. 필터로 줄여 주세요. 내려받기는 전체를 담습니다."));
  }

  function toggleMark(uid) {
    const s = bookmarks();
    if (s.has(uid)) s.delete(uid); else s.add(uid);
    save("bookmarkU", [...s]);
    renderNotes();
  }

  function exportMd() {
    const list = noteList();
    if (!list.length) { err("내려받을 문항이 없습니다."); return; }
    const lines = [`# 정비산업기사 책갈피·오답 노트`, "", `${today()} · ${list.length}문항`, ""];
    list.forEach((x) => {
      lines.push(`## ${x.n}번 · ${x.subject} · ${x.set}`, "", x.question, "");
      (x.choices || []).forEach((c, i) => lines.push(`${i + 1}) ${c}${secret[x.n].ci === i ? "  ← 정답" : ""}`));
      if (!mcOk(x)) lines.push(`- 정답 키: ${secret[x.n].answer}`);
      if (secret[x.n].solution) lines.push(`- 풀이: ${secret[x.n].solution}`);
      lines.push("");
    });
    const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
    const a = el("a");
    a.href = URL.createObjectURL(blob);
    a.download = `정비_오답노트_${today()}.md`;
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  $("nMode").addEventListener("change", renderNotes);
  $("nSubj").addEventListener("change", renderNotes);
  $("nQ").addEventListener("input", renderNotes);
  $("nMd").addEventListener("click", exportMd);
  $("nPrint").addEventListener("click", () => {
    document.querySelectorAll("#nList details").forEach((d) => { d.open = true; });
    window.print();
  });

  // ---- 4. 암기 카드 ----
  let deck = [];
  let cardIdx = 0;
  let flipped = false;

  function knownSet() { return new Set(load("cardKnownU", [])); }

  function buildDeck(shuffleIt) {
    const mode = $("cMode").value;
    const subj = $("cSubj").value;
    const hide = $("cHide").checked;
    const marks = bookmarks();
    const known = knownSet();
    let d = items.filter(hasKey).filter((x) => {
      if (subj && x.subject !== subj) return false;
      if (hide && known.has(x.uid)) return false;
      const wrong = verdictOf(x) === "wrong";
      const mark = marks.has(x.uid);
      if (mode === "mark") return mark;
      if (mode === "wrong") return wrong;
      if (mode === "either") return mark || wrong;
      return true;
    });
    deck = shuffleIt ? shuffle(d) : d;
    cardIdx = 0;
    flipped = false;
  }

  function renderCard() {
    const box = $("cCard");
    box.textContent = "";
    if (!deck.length) {
      box.textContent = "카드가 없습니다. 필터를 바꾸거나 '외운 카드 빼기'를 끄세요.";
      $("cPos").textContent = "0 / 0";
      $("cPrev").disabled = $("cNext").disabled = $("cKnown").disabled = true;
      return;
    }
    $("cPrev").disabled = $("cNext").disabled = $("cKnown").disabled = false;
    const x = deck[cardIdx];
    const face = el("div", "face", `${flipped ? "정답" : "문제"} · ${x.subject} · ${x.n}번`);
    box.append(face);
    if (!flipped) {
      box.append(document.createTextNode(x.question));
    } else {
      box.append(document.createTextNode(`${answerText(x)}`));
      if (secret[x.n].solution) box.append(document.createTextNode(`\n\n${secret[x.n].solution}`));
    }
    $("cPos").textContent = `${cardIdx + 1} / ${deck.length}`;
    $("cKnown").textContent = knownSet().has(x.uid) ? "외움 취소" : "외웠어요";
  }

  function flip() { flipped = !flipped; renderCard(); }
  function move(d) {
    if (!deck.length) return;
    cardIdx = (cardIdx + d + deck.length) % deck.length;
    flipped = false;
    renderCard();
  }
  function toggleKnown() {
    if (!deck.length) return;
    const uid = deck[cardIdx].uid;
    const s = knownSet();
    if (s.has(uid)) s.delete(uid); else s.add(uid);
    save("cardKnownU", [...s]);
    renderCard();
  }

  fillSubjects($("nSubj"));
  fillSubjects($("cSubj"));
  $("cMode").addEventListener("change", () => { buildDeck(false); renderCard(); });
  $("cSubj").addEventListener("change", () => { buildDeck(false); renderCard(); });
  $("cHide").addEventListener("change", () => { buildDeck(false); renderCard(); });
  $("cShuffle").addEventListener("click", () => { buildDeck(true); renderCard(); });
  $("cCard").addEventListener("click", flip);
  $("cCard").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  $("cPrev").addEventListener("click", () => move(-1));
  $("cNext").addEventListener("click", () => move(1));
  $("cKnown").addEventListener("click", toggleKnown);
  document.addEventListener("keydown", (e) => {
    if ($("tab-cards").hidden || e.target.matches("input,select,textarea")) return;
    if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
  });

  buildDeck(false);
  show("mock");
})();
</script>
</body>
</html>
